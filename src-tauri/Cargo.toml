[package]
name = "inkleet"
version = "0.0.1"
edition = "2021"

[lib]
name = "inkleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
tauri = "=2.12.3"
serde = { version = "1", features = ["derive"] }
tempfile = "3"

# 使用内置 WebPKI 根证书，避免 Android TLS 依赖额外平台初始化。
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde_json = "=1.0.154"

inkleet-managed-env = { path = "../crates/managed-env" }
