[package]
name = "inkleet"
version = "0.1.1"
edition = "2021"

[features]
# Opt-in diagnostic tracing; release and non-Linux tracing remain disabled.
native-snippet-validation = []
# Temporary C/C++ acceptance experiment, debug Linux x86_64 only.
native-clang-snippet-validation = ["native-snippet-validation"]
# Includes existing gated clang checks in the same full native validation build.
native-java-snippet-validation = ["native-clang-snippet-validation"]

[lib]
name = "inkleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
tauri = "=2.12.3"
serde = { version = "1", features = ["derive"] }
tempfile = "3"

# 使用内置 WebPKI 根证书，避免 Android TLS 依赖额外平台初始化。
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde_json = "=1.0.154"

inkleet-managed-env = { path = "../crates/managed-env" }
