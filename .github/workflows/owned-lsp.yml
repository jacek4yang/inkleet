name: Owned LSP request invariants
on:
  push:
    branches: [feat/owned-lsp-cancellation]
    paths: ['crates/managed-env/src/**', 'crates/managed-env/Cargo.*', '.github/workflows/owned-lsp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owned-lsp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/managed-env
      - name: Test bounded RPC and existing environment invariants
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/BUILD_COMMIT.txt
          cargo test --locked --manifest-path crates/managed-env/Cargo.toml 2>&1 | tee evidence/owned-rpc-tests.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: owned-lsp-invariants
          path: evidence/
          retention-days: 7
