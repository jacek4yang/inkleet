name: Real editing language services
on:
  pull_request:
    paths: ['src-tauri/src/lsp*.rs', 'src-tauri/src/completion_cache.rs', 'crates/managed-env/examples/editing_lsp_probe.rs', '.github/workflows/editing-lsp.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editing-lsp-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  actual-adapters:
    name: Editing LSP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/managed-env
      - name: Test production edit guards and actual private language servers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence/editing
          git rev-parse HEAD > evidence/editing/BUILD_COMMIT.txt
          printf 'Actual managed LSP protocol; NOT native GUI, IME or input latency acceptance.\n' > evidence/editing/SCOPE.txt
          cargo test --locked --manifest-path crates/managed-env/Cargo.toml --example editing_lsp_probe 2>&1 | tee evidence/editing/edit-guards.txt
          cargo run --locked --manifest-path crates/managed-env/Cargo.toml --example editing_lsp_probe 2>&1 | tee evidence/editing/actual-lsp.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: actual-editing-lsp-${{ matrix.os }}
          path: evidence/editing/
          if-no-files-found: error
          retention-days: 7
