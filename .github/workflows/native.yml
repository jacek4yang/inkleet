name: Native Linux
on:
  push:
    branches: [main, feat/first-workbench, feat/editor-p0-reliability, feat/workbench-minimal-ui, feat/real-question-workspace, feat/download-proxy-inputs, feat/debugger-workspace, feat/named-solutions, feat/language-adapter-contract, feat/lsp-p1-recovery, feat/workbench-visual-polish, feat/format-on-save, feat/debugger-precision-dock, feat/lsp-semantic-analysis, feat/ide-command-routing, feat/editor-input-reliability, feat/explicit-save, feat/polished-linux-preview, feat/vim-status-cursor, feat/real-use-hardening, feat/completion-integration, feat/completion-request-ownership, feat/completion-issuer-order, feat/lsp-status-ownership, perf/runner-rendering, perf/reading-panes, fix/in-place-results, feat/case-expectations, feat/case-run-context, feat/named-case-batches, feat/owned-lsp-cancellation, perf/diagnostics-dedup, perf/live-source-boundary, fix/judge-terminal-verdict, test/native-snippet-validation, feat/validated-linux-snippets, test/native-clang-snippets, test/native-java-snippets, fix/session-completion-mode, fix/completion-snippet-capability, style/ide-popovers, style/full-completion-content, feat/expanded-documentation, feat/recursive-source-navigation, perf/editor-session-retention, feat/document-reader-search, feat/document-code-highlighting, fix/completion-candidate-admission, style/continuous-document-matches, fix/queued-save-intent]
    paths: ['src/**', 'src-tauri/**', 'crates/managed-env/src/**', 'crates/managed-env/packages.json', 'crates/managed-env/Cargo.toml', 'crates/managed-env/Cargo.lock', 'package*.json', 'tests/native_smoke.py', '.github/workflows/native.yml']
  workflow_dispatch:
    inputs:
      snippets:
        description: Enable debug-only native snippet validation traces
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-smoke:
    env:
      INKLEET_NATIVE_SNIPPETS: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test/native-snippet-validation' || github.ref == 'refs/heads/feat/validated-linux-snippets' || github.ref == 'refs/heads/test/native-clang-snippets' || github.ref == 'refs/heads/test/native-java-snippets' || github.ref == 'refs/heads/fix/session-completion-mode' || github.ref == 'refs/heads/fix/completion-snippet-capability' || github.ref == 'refs/heads/style/ide-popovers' || github.ref == 'refs/heads/style/full-completion-content' || github.ref == 'refs/heads/feat/expanded-documentation' || github.ref == 'refs/heads/feat/recursive-source-navigation' || github.ref == 'refs/heads/perf/editor-session-retention' || github.ref == 'refs/heads/feat/document-reader-search' || github.ref == 'refs/heads/feat/document-code-highlighting' || github.ref == 'refs/heads/fix/completion-candidate-admission' || github.ref == 'refs/heads/style/continuous-document-matches' || github.ref == 'refs/heads/fix/queued-save-intent')) || inputs.snippets == true }}
      INKLEET_NATIVE_SNIPPET_FEATURE: ${{ (github.ref == 'refs/heads/test/native-java-snippets' || github.ref == 'refs/heads/fix/session-completion-mode' || github.ref == 'refs/heads/fix/completion-snippet-capability' || github.ref == 'refs/heads/style/ide-popovers' || github.ref == 'refs/heads/style/full-completion-content' || github.ref == 'refs/heads/feat/expanded-documentation' || github.ref == 'refs/heads/feat/recursive-source-navigation' || github.ref == 'refs/heads/perf/editor-session-retention' || github.ref == 'refs/heads/feat/document-reader-search' || github.ref == 'refs/heads/feat/document-code-highlighting' || github.ref == 'refs/heads/fix/completion-candidate-admission' || github.ref == 'refs/heads/style/continuous-document-matches' || github.ref == 'refs/heads/fix/queued-save-intent') && 'native-java-snippet-validation' || github.ref == 'refs/heads/test/native-clang-snippets' && 'native-clang-snippet-validation' || 'native-snippet-validation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Install native testing prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus-x11 at-spi2-core scrot xclip xdotool fonts-noto-cjk
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Build native test application
        run: |
          npm ci --ignore-scripts
          npm run tauri -- icon icon.svg
          npm run typecheck
          npm run build
          cargo test --locked --manifest-path crates/managed-env/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          mkdir -p evidence/native
          git rev-parse HEAD > evidence/native/BUILD_COMMIT.txt
          printf 'debug-linux-no-bundle; snippet-validation=%s; feature=%s\n' "$INKLEET_NATIVE_SNIPPETS" "$INKLEET_NATIVE_SNIPPET_FEATURE" > evidence/native/BUILD_PROFILE.txt
          if [ "$INKLEET_NATIVE_SNIPPETS" = "true" ]; then
            cargo test --locked --manifest-path src-tauri/Cargo.toml --features "$INKLEET_NATIVE_SNIPPET_FEATURE"
            npm run tauri -- build --debug --no-bundle --features "$INKLEET_NATIVE_SNIPPET_FEATURE"
          else
            npm run tauri -- build --debug --no-bundle
          fi
      - name: Probe public Chinese site separately
        if: env.INKLEET_NATIVE_SNIPPETS != 'true'
        id: public-probe
        continue-on-error: true
        run: |
          mkdir -p evidence/protocol
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml public_cn_probe -- --ignored > evidence/protocol/public-cn.log 2>&1
          result=$?
          printf '%s\n' "$result" > evidence/protocol/exit-code.txt
          exit "$result"
      - name: Verify native storage through the actual GUI
        env:
          INKLEET_MANAGED_ENV: "1"
          INKLEET_JAVA_SNIPPET_VALIDATION: ${{ env.INKLEET_NATIVE_SNIPPETS == 'true' && env.INKLEET_NATIVE_SNIPPET_FEATURE == 'native-java-snippet-validation' && '1' || '0' }}
          INKLEET_CLANG_SNIPPET_VALIDATION: ${{ env.INKLEET_NATIVE_SNIPPETS == 'true' && (env.INKLEET_NATIVE_SNIPPET_FEATURE == 'native-clang-snippet-validation' || env.INKLEET_NATIVE_SNIPPET_FEATURE == 'native-java-snippet-validation') && '1' || '0' }}
          INKLEET_SNIPPET_VALIDATION: ${{ env.INKLEET_NATIVE_SNIPPETS == 'true' && '1' || '0' }}
          INKLEET_LIVE_CN: ${{ steps.public-probe.outcome == 'success' && '1' || '0' }}
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          xvfb-run -a dbus-run-session -- python3 tests/native_smoke.py
      - name: Capture native crash diagnostics
        if: failure()
        run: |
          mkdir -p evidence/native
          { sudo dmesg --ctime 2>/dev/null || true; } | grep -Ei 'segfault|out of memory|killed process|inkleet|webkit' | tail -80 > evidence/native/kernel-errors.txt || true
          free -m > evidence/native/memory.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-linux-verification
          path: |
            evidence/native/
            evidence/protocol/
            src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 7
