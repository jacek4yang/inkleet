name: Resolve additional language distributions
on:
  push:
    branches: [feat/first-workbench]
    paths: ['tests/resolve_more_tools.py', '.github/workflows/more-pins.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tests/resolve_more_tools.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: additional-official-tool-metadata
          path: evidence/more-tool-packages.json
          retention-days: 7
