name: Verify Go language server source
on:
  push:
    branches: [feat/first-workbench, main]
    paths: ['tests/resolve_gopls_pin.py', '.github/workflows/gopls-pin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vendor-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tests/resolve_gopls_pin.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-gopls-source
          path: evidence/
          retention-days: 7
