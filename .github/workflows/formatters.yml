name: Managed formatters
on:
  push:
    branches: [feat/format-on-save]
    paths: ['crates/managed-env/**', '.github/workflows/formatters.yml']
permissions:
  contents: read
jobs:
  formatters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/managed-env
      - run: cargo test --locked --manifest-path crates/managed-env/Cargo.toml
      - run: cargo run --locked --manifest-path crates/managed-env/Cargo.toml --example formatter_probe
