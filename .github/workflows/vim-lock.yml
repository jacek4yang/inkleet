name: Prepare pinned Vim dependency
on:
  push:
    branches: [feat/vim-keyboard-workflow]
    paths: ['.github/workflows/vim-lock.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Resolve and verify official registry package
        run: |
          npm view @replit/codemirror-vim@6.4.0 --json > vim-package-metadata.json
          npm install --save-exact --ignore-scripts @replit/codemirror-vim@6.4.0
          npm ls @codemirror/state @codemirror/view @replit/codemirror-vim
          npm run typecheck
          npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: vim-dependency-lock
          path: |
            package.json
            package-lock.json
            vim-package-metadata.json
          retention-days: 7
