name: Owned process shutdown
on:
  push:
    branches: [feat/first-workbench, main]
    paths: ['crates/managed-env/src/process.rs', 'crates/managed-env/src/rpc.rs', 'crates/managed-env/examples/shutdown_probe.rs', '.github/workflows/shutdown.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owned-shutdown-${{ github.ref }}
  cancel-in-progress: false
jobs:
  process-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/managed-env
      - name: Verify bounded shutdown and reject racing new processes
        shell: bash
        run: |
          mkdir -p evidence
          cargo run --locked --manifest-path crates/managed-env/Cargo.toml --example shutdown_probe 2>&1 | tee evidence/shutdown.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: process-shutdown-${{ matrix.os }}
          path: evidence/
          retention-days: 7
