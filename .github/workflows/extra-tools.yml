name: Additional isolated language tools
on:
  push:
    branches: [main]
    paths: ['crates/managed-env/**', '.github/workflows/extra-tools.yml']
  pull_request:
    paths: ['crates/managed-env/**', '.github/workflows/extra-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extra-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/managed-env
      - name: Verify private runtimes and tool entry points
        shell: bash
        run: |
          mkdir -p evidence
          cargo run --locked --manifest-path crates/managed-env/Cargo.toml --example extra_probe 2>&1 | tee evidence/extra-tools.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: extra-tools-${{ matrix.os }}
          path: |
            evidence/
            crates/managed-env/Cargo.lock
          retention-days: 7
