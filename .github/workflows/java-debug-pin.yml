name: Verify Java debug distribution
on:
  push:
    branches: [feat/first-workbench, main]
    paths: ['scripts/pin-java-debug.py', '.github/workflows/java-debug-pin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify official Microsoft extension identity and plugin digest
        run: python3 scripts/pin-java-debug.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: java-debug-distribution-pin
          path: evidence/
          retention-days: 7
