name: Windows Rust Unicode linker
on:
  push:
    branches: [feat/first-workbench, main]
    paths: ['crates/managed-env/examples/rust_windows_probe.rs', '.github/workflows/rust-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unicode-linker:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/managed-env
      - shell: bash
        run: |
          mkdir -p evidence
          cargo run --locked --manifest-path crates/managed-env/Cargo.toml --example rust_windows_probe 2>&1 | tee evidence/rust-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rust-windows-unicode
          path: evidence/rust-windows.txt
          retention-days: 7
