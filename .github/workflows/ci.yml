name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install pinned direct dependencies
        run: npm install --ignore-scripts
      - name: Test domain invariants
        run: npm test
      - name: Build frontend preview
        run: npm run build
      - name: Record build identity
        run: |
          git rev-parse HEAD > dist/BUILD_COMMIT.txt
          printf 'Frontend preview only. Native persistence and LeetCode are not verified.\n' > dist/VERIFICATION.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-preview
          path: |
            dist/
            package-lock.json
          if-no-files-found: error
          retention-days: 7
