name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify remote checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git ls-files > evidence/files.txt
          printf 'Repository checkpoint verified. No application tests exist yet.\n' > evidence/result.txt
          cat evidence/result.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkpoint-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
