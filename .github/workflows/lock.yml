name: Refresh npm lock
on:
  push:
    branches: [feat/first-workbench]
    paths: ['.github/workflows/lock.yml']
permissions:
  contents: read
jobs:
  npm-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Resolve the reviewed dependency without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact marked@18.1.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-npm-lock
          path: |
            package.json
            package-lock.json
          retention-days: 7
