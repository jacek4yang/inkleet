name: Managed development environments
on:
  push:
    branches: [feat/first-workbench, feat/language-adapter-contract, main]
    paths: ['crates/managed-env/src/**', 'crates/managed-env/packages.json', 'crates/managed-env/Cargo.toml', 'crates/managed-env/Cargo.lock', 'crates/managed-env/examples/probe.rs', 'crates/managed-env/examples/compiler_probe.rs', '.github/workflows/managed-env.yml', 'tests/resolve_tool_pins.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managed-env-${{ github.ref }}
  # Preserve an active full-platform qualification; replace only queued obsolete heads.
  cancel-in-progress: false
jobs:
  isolated-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/managed-env
      - name: Test locked installer and protocol safety boundaries
        id: unit
        shell: bash
        run: |
          mkdir -p evidence
          cargo test --locked --manifest-path crates/managed-env/Cargo.toml 2>&1 | tee evidence/unit-tests.txt
      - name: Download, verify and execute private Python without system PATH
        shell: bash
        run: cargo run --locked --manifest-path crates/managed-env/Cargo.toml --example probe 2>&1 | tee evidence/private-tools.txt
      - name: Verify private Rust and C/C++ compilation without system PATH
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        shell: bash
        run: cargo run --locked --manifest-path crates/managed-env/Cargo.toml --example compiler_probe 2>&1 | tee evidence/private-compilers.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: managed-env-${{ matrix.os }}
          path: |
            evidence/
            crates/managed-env/Cargo.lock
          retention-days: 7
  pin-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tests/resolve_tool_pins.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-node-pins
          path: evidence/node-packages.json
          retention-days: 7
