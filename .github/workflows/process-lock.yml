name: Prepare process and archive dependencies
on:
  push:
    branches: [feat/first-workbench]
    paths: ['.github/workflows/process-lock.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve portable process-tree and archive libraries
        run: |
          cat >> crates/managed-env/Cargo.toml <<'EOF'
          process-wrap = { version = "=10.0.1", features = ["std"] }
          lzma-rust2 = { version = "=0.22.0", default-features = false, features = ["std", "xz"] }
          zip = { version = "=9.0.2", default-features = false, features = ["deflate-flate2"] }
          EOF
          cargo metadata --format-version 1 --manifest-path crates/managed-env/Cargo.toml > /dev/null
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          cargo test --locked --manifest-path crates/managed-env/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: portable-process-archive-locks
          path: |
            crates/managed-env/Cargo.toml
            crates/managed-env/Cargo.lock
            src-tauri/Cargo.lock
          retention-days: 7
